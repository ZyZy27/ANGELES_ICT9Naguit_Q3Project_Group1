<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Project</title>

    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Jost', sans-serif;
            margin: 0;
            background: #f2f2f2;
        }
        .hero-section{
            background-image: url("hero.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 30px 90px;
            min-height: 150px;
            overflow: visible;
            position: relative;
        }
        .hero h1, .hero h2{
            font-weight: 200;
            margin: 0;
        }
        .logo{
            width: 350px;
            height: 350px;
            object-fit: contain;
            position: relative;
            right: 0;
        }
        .navbar{
            width: 96%;
            height: 80px;
            background-color: #1b5f83;
            color:  white;
            position: sticky;
            top: 20px;
            margin-top: 40px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Jost';
            padding: 0 40px;
        }
        .btn-group{
            position: relative;
            display: flex;
            gap: 25px;
        }
        .btn{
            padding: 10px 18px;
            font-size: 14px;
            color: white;
            background-color: transparent;
            font-family: 'Jost';
            border: none;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
        }
        .btn:hover{
            color: #1b5f83 ;
            background-color: white;
        }
        .content{
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 80px;
            padding: 80px 120px;
        }
        .image-container{
            width: 650px;
            height: 450px;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-image{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .text-container{
            max-width: 420px;
            font-family: 'Jost', sans-serif;
            margin-left: 40px;
        }
        .text-container h2{
            font-weight: 200;
            font-size: 60px;
            margin: 0;
            line-height: 1.3;
        }
        .register{
            border-radius: 20px;
            border: none;
            color: white;
            background: #2b6b88;
            margin-top: 25px;
            font-weight: 700;
            padding: 14px 32px;
            cursor: pointer;
            font-size: 16px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-section">
            <div>
            <h1 style="letter-spacing: 6px; font-size: 80px; color: #1b5f83;">LINK LUZON,</h1>
            <h2 style="letter-spacing: 4px; font-size: 50px;">RIDE THE FUTURE</h2>
            </div>

            <img src="logo.png" alt="LuzonLink Rail Logo" class="logo">
        </div>

    </header>

    <div class="navbar">
    <p style="font-size: 26px; font-weight: 300;">LUZONLINK RAIL</p>

    <div class="btn-group">
        <a href="index.html"><button class="btn">HOME</button></a>
        <a href="reg.html"><button class="btn">REGISTER</button></a>
        <a href="farem.html"><button class="btn">FARE MATRIX</button></a>
    </div>
</div>

    <section class="content">
    <div class="image-container">
        <img src="train.jpg" class="main-image">
    </div>

    <div class="text-container">
        <h2>Unlock Luzon —<br>One Rail at a Time.</h2>
    
    <button class="register">REGISTER</button>
    </div>
    </section>
    
</body>
</html>
